name: Daily job discovery

on:
  schedule:
    # 12:00 UTC daily (08:00 America/New_York during EDT).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create fresh environment and install project
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium
        run: |
          . .venv/bin/activate
          python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          NOTIFICATION_FROM: ${{ secrets.NOTIFICATION_FROM }}
          LOG_FORMAT: json
        run: |
          . .venv/bin/activate
          python -m src.main

      - name: Commit generated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current data/archive
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "chore: update daily job tracker"
            git push
          fi
