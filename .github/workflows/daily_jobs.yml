name: Daily job discovery

on:
  schedule:
    # 12:00 UTC daily (08:00 America/New_York during EDT).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create fresh environment and install project
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium
        run: |
          . .venv/bin/activate
          python -m playwright install --with-deps chromium

      - name: Run pipeline
        # Production entrypoint only. This job does not pass browser or smoke flags.
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          NOTIFICATION_FROM: ${{ secrets.NOTIFICATION_FROM }}
          LOG_FORMAT: json
        run: |
          . .venv/bin/activate
          python -m src.main 2>&1 | tee pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: pipeline.log
          retention-days: 7

      - name: Commit generated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ATS registry is static config. Do not commit it from the daily run.
          # data/learning is the discovery-memory file written by a real run.
          git add data/current data/archive
          if [ -d data/learning ]; then
            git add data/learning
          fi
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "chore: update daily job tracker"
            # Discovery can rewrite other tracked files, such as the ATS
            # registry. Drop those so rebase is not blocked and they are not pushed.
            git checkout -- .
            # main may move while discovery runs. Replay this tracker commit
            # onto the latest main and retry. Never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push rejected; retrying onto latest main (attempt ${attempt})."
            done
            echo "Failed to push tracker commit."
            exit 1
          fi
