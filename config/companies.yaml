# ---------------------------------------------------------------------------
# Company universe.
#
# Production discovery uses the ENABLED companies below. Identifiers marked
# `discovery: manual` were confirmed against a public ATS URL or public job-board
# API. Nothing in this file is guessed from a company name.
#
# Unverified Fortune 500 names stay in the universe with enabled: false so they
# can be turned on later without being deleted. Fixture companies live only
# under tests/fixtures and tests/conftest.py.
#
# Priority at runtime:
#   manual company config → verified ats_registry → automatic ATS discovery
#   → company career-page fallback → optional Jobright
# ---------------------------------------------------------------------------

