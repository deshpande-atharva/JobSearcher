# ---------------------------------------------------------------------------
# job-agent runtime settings
#
# Everything here is data, not code. Change behaviour without touching Python.
# Values are validated by src/models/config.py (Pydantic), so typos fail fast
# with a readable error instead of silently doing the wrong thing.
# ---------------------------------------------------------------------------

run:
  # Observational window used by previews and --freshness-hours.
  # The daily tracker uses the freshness tiers below, not this cutoff.
  freshness_hours: 24
  # If posted_at is missing, age may be taken from updated_at. Posted and
  # updated dates are never merged into one fabricated posted_at.
  freshness_use_updated_when_posted_missing: true
  # Upper bound on concurrent outbound HTTP requests across all sources.
  max_concurrency: 8
  request_timeout_seconds: 30
  company_timeout_seconds: 240
  retry_attempts: 3
  retry_backoff_seconds: 1.5
  # Politeness identifier sent with every request.
  user_agent: "job-agent/1.0 (+https://github.com/your-username/job-agent)"
  # Safety cap after cross-source dedup. 0 = process every job.
  # 15000 covers the enabled company universe once Workday CXS paginates
  # (~3100 Greenhouse + ~6300 Workday + Lever/Ashby/career). Truncation,
  # if it ever happens, is round-robin by company and reported.
  max_jobs_per_run: 15000

# Daily eligibility. Age is elapsed UTC time from the employer timestamp.
# VERY_FRESH <24h, FRESH <72h, RECENT <168h, AGING <336h, STALE <720h, else OLD.
# VERY_FRESH, FRESH, and RECENT stay eligible. AGING stays eligible only when
# role and seniority already passed deterministically. STALE, OLD, and UNKNOWN
# stay out of the daily workbook. first_seen_at is not a posting date.
freshness:
  enabled: true
  eligible_through: RECENT
  aging_if_strongly_qualified: true
  tiers:
    very_fresh_hours: 24
    fresh_hours: 72
    recent_hours: 168
    aging_hours: 336
    stale_hours: 720

discovery:
  sources:
    jobright:
      # Discovery only. Off until a live run resolves official URLs reliably.
      # The scheduled workflow does not turn this on.
      enabled: false
      # Public listing that includes job cards. The entry-level page is SEO copy
      # without postings. Individual /jobs/info pages currently return 403.
      entry_url: "https://jobright.ai/remote-jobs/software-engineering"
      max_pages: 1
      allow_browser_render: false
      max_queries: 1
      max_results_per_query: 40
      max_total_results: 80
      max_detail_pages: 1
      max_navigation_attempts: 1
    greenhouse:
      enabled: true
    lever:
      enabled: true
      max_companies: 8
      max_jobs: 400
      max_detail_pages: 0
      max_navigation_attempts: 0
    ashby:
      enabled: true
      max_companies: 8
      max_jobs: 400
      max_detail_pages: 0
      max_navigation_attempts: 0
    smartrecruiters:
      enabled: true
    workday:
      enabled: true
      # Public CXS tenants reject limit>20 with HTTP 400. Do not raise this.
      page_size: 20
      max_jobs: 2000
      # Workday-only bound. Greenhouse/Lever/Ashby keep run.max_concurrency.
      max_concurrency: 2
      # Playwright discovery is additive. Leave this false for the daily run.
      browser_enabled: false
      browser_max_jobs: 80
      browser_detail_limit: 12
      # Only after a board hits max_jobs. Uses the searchText field the
      # public CXS body already sends. appliedFacets stay empty.
      partitions_enabled: true
      max_partitions_per_company: 3
      max_jobs_per_partition: 120
      max_requests_per_company: 140
      max_requests_per_run: 800
      partition_search_texts:
        - software engineer
        - backend engineer
        - platform engineer
    icims:
      enabled: true
    company_career:
      enabled: true
  # Cache of successfully discovered ATS identifiers (no secrets, no job data).
  ats_registry: "config/ats_registry.yaml"
  auto_detect_ats: true
  # Static repository configuration. Daily production must not rewrite it.
  persist_ats_registry: false
  career_detail_fetch_limit: 12
  # Career fallback stage budget. The company timeout remains 240s.
  career_stage_budget_seconds: 90
  skip_career_page_when_ats_has_jobs: true
  # Extra public boards beyond companies.yaml.
  # Internet Archive CDX samples, rotated by UTC date.
  # Not a complete directory. Workday is the same kind of partial sample:
  # public career hosts only, then the existing CXS collector.
  # A Workday board's pagination uses run.company_timeout_seconds so a
  # board can reach the public 2,000-job cap instead of being cut off early.
  global_boards:
    enabled: true
    greenhouse: true
    ashby: true
    workday: true
    max_index_urls: 40
    max_boards_per_run: 8
    prefixes_per_run: 4
    index_timeout_seconds: 40
    board_timeout_seconds: 45

filters:
  # Employment types kept in the output. See EmploymentType enum.
  employment_types: ["Full-time", "Contract", "Internship", "Co-op"]
  # Maximum *required* years of experience the target profile accepts.
  max_required_years: 2
  # Preferred/"nice to have" experience above this bound does not reject a job.
  ignore_preferred_experience: true
  require_us_location: true
  # Seniority words that reject a posting outright when they qualify the role.
  reject_seniority_terms:
    - senior
    - sr.
    - staff
    - principal
    - lead
    - manager
    - director
    - head of
    - architect
    - vp
    - vice president
    - distinguished
    - fellow
    - ii
    - iii
    - iv

urls:
  # Aggregators and search engines. Useful for *discovery*, never acceptable as
  # the final application URL.
  aggregator_hosts:
    - linkedin.com
    - indeed.com
    - glassdoor.com
    - jobright.ai
    - ziprecruiter.com
    - dice.com
    - monster.com
    - simplyhired.com
    - careerbuilder.com
    - google.com
    - bing.com
    - duckduckgo.com
    - jobs.google.com
    - lensa.com
    - talent.com
    - jooble.org
    - builtin.com
    - wellfound.com
    - angel.co
    - handshake.com
    - joinhandshake.com
  # Host suffixes recognised as a legitimate applicant tracking system.
  ats_hosts:
    greenhouse:
      - boards.greenhouse.io
      - job-boards.greenhouse.io
      - boards.eu.greenhouse.io
      - job-boards.eu.greenhouse.io
    lever:
      - jobs.lever.co
      - jobs.eu.lever.co
    workday:
      - myworkdayjobs.com
      - myworkdaysite.com
      - wd1.myworkdayjobs.com
      - wd5.myworkdayjobs.com
    ashby:
      - jobs.ashbyhq.com
    smartrecruiters:
      - jobs.smartrecruiters.com
      - careers.smartrecruiters.com
    icims:
      - icims.com
    other_ats:
      - workable.com
      - jobvite.com
      - breezy.hr
      - recruitee.com
      - teamtailor.com
      - bamboohr.com
      - successfactors.com
      - taleo.net
      - oraclecloud.com
      - eightfold.ai
      - phenompeople.com
      - avature.net
      - paylocity.com
      - rippling-ats.com
      - applytojob.com
  # Query parameters stripped during URL canonicalisation.
  strip_query_params:
    - utm_source
    - utm_medium
    - utm_campaign
    - utm_term
    - utm_content
    - gh_src
    - gh_jid_src
    - ref
    - referrer
    - source
    - src
    - trk
    - trackingId
    - lever-source
    - _gl
    - fbclid
    - gclid
  # Verify the final URL resolves (HEAD, falling back to GET).
  verify_reachability: true
  # A completed failed probe rejects the job and keeps the URL on the rejection.
  # An ATS-shaped host is not enough. Fixture mode does not probe.
  allow_unverified_ats_urls: false

# ---------------------------------------------------------------------------
# H-1B sponsorship EVIDENCE configuration.
#
# READ THIS BEFORE EDITING: these settings control how sponsorship evidence is
# *gathered and interpreted*. They must never remove a job. There is
# deliberately no `require_h1b_sponsorship` option -- see
# src/services/h1b.py and tests/test_h1b_sponsorship.py, which assert that
# otherwise-qualified jobs survive every sponsorship outcome.
# ---------------------------------------------------------------------------
visa:
  enabled: true
  provider: h1bgrader
  base_url: "https://h1bgrader.com/h1b-sponsors"
  historical_lookback_years: 5
  use_job_title_matching: true
  use_location_matching: true
  use_current_posting_language: true
  use_gemini_for_ambiguous_language: true
  # Cache lookups for the duration of a run (and across runs, on disk).
  cache_ttl_hours: 168
  cache_path: "data/cache/h1b_lookups.json"
  # Skip the network lookup entirely when the current posting already gives an
  # explicit, unambiguous job-level answer. Saves requests, changes nothing.
  skip_lookup_when_job_explicit: true
  # Minimum confidence a posting-language signal needs to be treated as
  # explicit rather than ambiguous.
  explicit_language_confidence: 0.7

llm:
  provider: gemini
  model: "gemini-3.6-flash"
  temperature: 0.0
  max_output_tokens: 2048
  timeout_seconds: 60
  # Budget per run. Once exhausted the pipeline falls back to deterministic
  # logic and marks ambiguity as UNKNOWN rather than guessing.
  max_calls_per_run: 300
  # Stop calling the provider after this many consecutive failures.
  circuit_breaker_failures: 5
  # One probe is allowed after this pause. A successful probe closes the breaker.
  circuit_reset_seconds: 30
  retry_attempts: 2
  retry_backoff_seconds: 0.5

output:
  current_workbook: "data/current/jobs.xlsx"
  archive_dir: "data/archive"
  # How far back to read archived workbooks when building the "already seen"
  # set used for historical deduplication.
  history_lookback_days: 120
  write_archive: true

notifications:
  enabled: true
  subject_prefix: "[job-agent]"
  # The email is a run summary, not a job dump.
  max_sample_jobs: 15

# Previous qualified outcomes adjust the next run. Empty memory keeps the
# current company crawls and the UTC-date public-board rotation.
learning:
  enabled: true
  path: "data/learning/discovery_memory.json"
  exploration_share: 0.20
  revisit_share: 0.10
  cooldown_runs: 3
  revisit_runs: 2
  min_runs_before_suppression: 2
  novelty_weight: 1.0
  exploration_bonus: 0.35
  revisit_bonus: 0.20

scraping:
  respect_robots_txt: true
  # Per-host floor. Still polite; not a bypass of site rate limits.
  min_delay_seconds: 0.25
  max_html_bytes: 4000000
  playwright:
    enabled: true
    headless: true
    timeout_seconds: 45
    max_renders_per_run: 12

fixtures:
  # Used by --fixture-mode. Offline copies of source payloads.
  directory: "tests/fixtures"

# Greenhouse navigation pilot only. The daily pipeline does not run this loop.
greenhouse_pilot:
  max_navigation_steps: 30
  max_navigation_seconds: 90
  navigation_dir: "data/navigation"
  report_dir: "data/reports"

board_search:
  enabled: true
  playwright_enabled: false
  max_strategies: 4
  max_pages: 2
  max_results_per_search: 20
  max_pagination: 1
  max_browser_seconds: 30.0
  max_retries: 1
  max_sites_per_run: 2
  boards:
    - workday
    - greenhouse
    - ashby
    - lever

candidate:
  resume_path: "data/candidate/resume.pdf"
  profile_path: "data/candidate/profile.json"
  history_dir: "data/candidate/profile_history"
